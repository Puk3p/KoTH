# ========================================== #
#               KoTH Arenas                  #
# ========================================== #
# This file is automatically updated when you use in-game commands.
# You can safely edit it manually, but be sure to use /koth reload after.
# (Keep every line of this header starting with "# " so the plugin preserves it on save.)
# ------------------------------------------ #
# Schedules are edited by hand. Times use settings.timezone from config.yml.
# Day keys: monday ... sunday, or daily. Always quote times: "18:00".
# Only one KoTH runs at a time; a slot that comes up while another KoTH is
# running is skipped (see the console). Arenas with enabled: false never auto-start.
# For KOTH Arena types /koth join opens join-time before the slot; the KoTH starts on the slot.
# ------------------------------------------ #
# Example arena:
# demon_hill:
#   type: "superkoth"
#   enabled: true
#   world: "world"
#   region:
#     min-x: 100
#     min-y: 60
#     min-z: 100
#     max-x: 110
#     max-y: 65
#     max-z: 110
#   spawn:
#     x: 105.5
#     y: 61.0
#     z: 105.5
#     yaw: 90.0
#     pitch: 0.0
#   schedule:
#     monday:
#       - "18:00"
#       - "22:00"
#     friday:
#       - "19:30"
#     daily:
#       - "12:00"

arenas:
